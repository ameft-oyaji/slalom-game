<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLALOM">
<meta name="description" content="2026/27 FISワールドカップ回転の日程で遊べるスラロームゲーム">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>スラローム・レース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: full-screen piste on canvas (skier low on screen, course rolling in from the top), broadcast-style timing graphics and menus floating above. Single snow look by design. */
:root{
  --snow:#F2F6FA; --ink:#13213A; --red:#D42A2F; --blue:#1F55C8; --amber:#FFC93C;
  --board:#0E1A2E; --board-2:#1A2945; --board-3:#24365A; --muted:#8E9BB3; --good:#3DDC84; --bad:#FF5A5F;
  --f-num:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--snow);color:var(--ink);font-family:var(--f-body)}
#app{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.board{background:var(--board);color:#fff;border-radius:4px;padding:5px 10px;box-shadow:0 2px 10px rgba(14,26,46,.25)}
.board .lbl{font-family:var(--f-num);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.board .val{font-family:var(--f-num);font-weight:700;font-size:21px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-l{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.clock{font-family:var(--f-num);font-style:italic;font-weight:800;font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;text-align:right;min-width:5.2ch}
.speed{font-family:var(--f-num);font-weight:500;font-size:15px;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.quit{pointer-events:auto;background:var(--board-2);color:#fff;border:0;border-radius:4px;font:700 12px var(--f-body);padding:8px 10px;cursor:pointer}

.speedo{background:rgba(14,26,46,.75);color:#fff;border-radius:4px;padding:5px 9px;font:700 18px var(--f-num);font-variant-numeric:tabular-nums}
.speedo small{font-size:11px;color:var(--muted);margin-left:3px;font-weight:500}

/* broadcast graphics */
.tv{position:absolute;inset:0;pointer-events:none;font-family:var(--f-num)}
.ev-label{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:58px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.ev-name{font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.ev-place{display:flex;align-items:center;gap:6px;font-weight:500;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.ev-run{margin-left:6px;color:#56657F}
.card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:18px;display:flex;align-items:stretch;background:rgba(255,255,255,.94);box-shadow:0 3px 14px rgba(14,26,46,.22);max-width:calc(100% - 32px)}
.c-rank{display:flex;align-items:center;justify-content:center;min-width:52px;padding:0 10px;background:var(--board);color:#fff;font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;border-bottom:4px solid rgba(0,0,0,.18)}
.c-rank.lead{background:linear-gradient(#22B35E,#1E9E53)}
.c-name{padding:5px 12px 5px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.c-first{font-weight:500;font-size:15px;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;line-height:1.05;white-space:nowrap}
.c-last{display:flex;align-items:center;gap:8px;font-weight:800;font-size:25px;color:#1B2E6B;letter-spacing:.01em;line-height:1.05;white-space:nowrap}
.c-last span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-bib{font-weight:600;font-size:14px;color:var(--ink);border:1.5px solid var(--ink);padding:0 5px;line-height:1.3;flex:none}
.c-nat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 10px;font-weight:700;font-size:13px;color:#1B2E6B;letter-spacing:.04em}
.c-time,.c-diff{display:flex;align-items:center;justify-content:center;min-width:96px;padding:0 14px;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.c-time{background:#13235E;color:#fff}
.c-diff{color:#fff;background:var(--board)}
.c-diff.good{background:#1FA855}
.c-diff.bad{background:#D93A3F}
.vs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:2px;white-space:nowrap}
.flag{display:inline-block;width:24px;height:16px;flex:none;box-shadow:0 0 0 1px rgba(19,33,58,.25);background:#C9D2E3}
.touch .tv.live .card{bottom:108px}
@media (max-width:560px){
  .ev-name{font-size:16px} .ev-place{font-size:13px}
  .c-last{font-size:20px} .c-first{font-size:13px} .c-time,.c-diff{min-width:76px;font-size:22px;padding:0 9px} .c-rank{min-width:40px;font-size:26px} .c-nat{padding:0 6px}
  .c-name{padding:4px 8px}
}

.msg{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-weight:700;font-size:17px;background:var(--red);color:#fff;padding:6px 16px;border-radius:3px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.msg.show{opacity:1}
.msg.info{background:var(--board)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--f-num);font-style:italic;font-weight:800;font-size:min(22vw,150px);color:var(--board);text-shadow:0 4px 0 rgba(255,255,255,.7)}
.cd.go{color:var(--red)}
.cd{flex-direction:column;gap:6px}
.cd small{display:block;font-family:var(--f-body);font-style:normal;font-weight:700;font-size:clamp(14px,3.4vw,22px);color:var(--board);background:rgba(255,255,255,.85);padding:4px 12px;border-radius:4px;text-shadow:none}
.cd em{display:block;font-family:var(--f-num);font-style:italic;font-weight:800;font-size:clamp(28px,8vw,56px);color:var(--board);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.cd em.beep{font-size:clamp(56px,16vw,120px);animation:beep 1s ease-out infinite}.cd em.beep.hi{color:var(--red)}
@keyframes beep{0%{transform:scale(1.15)}30%{transform:scale(1)}}
.cd.hurry em{color:var(--red)}
.cd.dsq{color:var(--red);font-size:min(18vw,110px)}

.pad{position:absolute;left:0;right:0;bottom:0;display:none;gap:8px;padding:0 max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.pad button{pointer-events:auto;flex:1;height:84px;border:0;border-radius:10px;background:rgba(14,26,46,.55);color:#fff;font:800 30px var(--f-num);touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pad button b{font:800 26px var(--f-body);line-height:1.1}
.pad button small{font:700 12px var(--f-body);opacity:.85}
.pad button.mid{flex:.7;font:700 14px var(--f-body);background:rgba(14,26,46,.4)}
.pad button.on{background:rgba(212,42,47,.85)}
.touch .pad.live{display:flex}

.icon-btn{position:absolute;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));background:var(--board);color:#fff;border:0;border-radius:4px;font:700 13px var(--f-body);padding:8px 12px;cursor:pointer;opacity:.85}
.icon-btn.raised{bottom:auto;top:10px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--board);color:#fff;border-radius:6px;box-shadow:0 12px 40px rgba(14,26,46,.35);overscroll-behavior:contain}
.panel-head{padding:16px 18px 12px;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%) 1}
.eyebrow{font-family:var(--f-num);font-weight:500;font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
h1{margin:2px 0 0;font-family:var(--f-num);font-style:italic;font-weight:800;font-size:50px;line-height:.95;letter-spacing:.01em}
h1 small{display:block;font-family:var(--f-body);font-style:normal;font-weight:700;font-size:14px;letter-spacing:.04em;margin-top:6px}
h2{margin:2px 0 0;font-weight:700;font-size:20px;text-wrap:balance}
h3{margin:0;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.panel-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--board-2);border-radius:4px;padding:2px}
.seg button{border:0;background:transparent;color:#C9D2E3;font:700 14px var(--f-body);padding:7px 14px;border-radius:3px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--board)}
select,input[type=text]{background:var(--board-2);color:#fff;border:1px solid var(--board-3);border-radius:4px;font:14px var(--f-body);padding:7px 8px;min-width:0}
input[type=text]{width:9em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--board-3);overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tabwrap{position:relative}
.tabarr{position:absolute;top:0;bottom:1px;width:38px;border:0;padding:0;z-index:1;cursor:pointer;color:var(--amber);font:800 20px var(--f-num);animation:tabblink 1s ease-in-out infinite}
.tabarr.l{left:0;text-align:left;padding-left:2px;background:linear-gradient(90deg,var(--board) 45%,rgba(14,26,46,0))}
.tabarr.r{right:0;text-align:right;padding-right:2px;background:linear-gradient(270deg,var(--board) 45%,rgba(14,26,46,0))}
@keyframes tabblink{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){ .tabarr{animation:none} }
.tabs button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--red)}
.rows{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;margin:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-family:var(--f-num);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-num);font-style:italic;font-weight:800;font-size:58px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--amber);color:var(--board);font-weight:700;font-size:12px;padding:2px 8px;border-radius:2px;vertical-align:middle;letter-spacing:.04em}
.badge.red{background:var(--red);color:#fff}
.badge.night{background:#3B4E78;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 auto;border:0;border-radius:4px;padding:12px 14px;font:700 15px var(--f-body);cursor:pointer;background:var(--board-2);color:#fff}
.btn.primary{background:var(--red);flex-basis:100%;font-size:17px}
.btn.small{flex:0 0 auto;padding:6px 10px;font-size:13px}
.btn.hot{background:var(--red)}
.btn:hover{filter:brightness(1.15)}
.note{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.howto{font-size:13px;line-height:1.7;color:#C9D2E3;margin:0;padding-left:1.2em}
.howto b{color:#fff}
kbd{font-family:var(--f-num);font-weight:700;background:var(--board-2);border-radius:3px;padding:0 6px;color:#fff;font-size:14px}

.cal{display:flex;flex-direction:column}
.cal .mon{font-family:var(--f-num);font-weight:700;letter-spacing:.12em;color:var(--muted);font-size:13px;padding:10px 0 4px;border-bottom:1px solid var(--board-3)}
.ev{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(36,54,90,.6);font-size:13px}
.ev .d{font-family:var(--f-num);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:#C9D2E3}
.ev .d small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);margin-left:2px}
.ev .v{min-width:0}
.ev .v b{font-weight:700}
.ev .v .nat{font-family:var(--f-num);color:var(--muted);margin-left:4px}
.ev .v .real{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.ev.dim{opacity:.55}
.ev.sl .d{color:#fff}
.ev.next{background:linear-gradient(90deg,rgba(212,42,47,.2),transparent)}
.chip{display:inline-block;font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:var(--board-3);color:#C9D2E3;margin-right:6px;vertical-align:1px}
.chip.SL{background:var(--red);color:#fff}
.ev .st{font-family:var(--f-num);font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.ev.wch{grid-template-columns:4.2em minmax(0,1fr);color:var(--amber)}
.today{font-size:11px;color:var(--amber);padding:6px 0;border-bottom:1px dashed var(--amber);font-weight:700}

.tbl-wrap{overflow-x:auto;max-height:46vh;overflow-y:auto;border:1px solid var(--board-3);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;color:inherit;font-family:inherit}
th,td{padding:5px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(36,54,90,.7)}
th{position:sticky;top:0;background:var(--board-2);color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.06em}
td.n{text-align:right;font-family:var(--f-num);font-size:15px;font-weight:700}
td.r{text-align:right;font-family:var(--f-num);font-size:15px;color:var(--muted)}
tr.me td{background:rgba(255,201,60,.18);color:#fff}
tr.cut td{border-bottom:2px solid var(--amber)}
.nat3{font-family:var(--f-num);color:var(--muted)}
.mv{font-family:var(--f-num);font-weight:700;font-size:13px;margin-left:4px}
.mv.up{color:var(--good)} .mv.down{color:var(--bad)} .mv.same{color:var(--muted)}
.globe{display:flex;gap:14px;align-items:center;background:var(--board-2);border-radius:4px;padding:10px 12px;border-left:4px solid var(--amber)}
.g-rank{display:flex;align-items:baseline;gap:2px;flex:none}
.g-num{font-family:var(--f-num);font-style:italic;font-weight:800;font-size:44px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.g-unit{font-weight:700;font-size:14px}
.g-txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.g-head{font-family:var(--f-num);font-weight:700;font-size:16px;letter-spacing:.03em}
.g-status{font-size:13px;line-height:1.5;color:#C9D2E3}
.g-status b{color:#fff}
.gear{display:flex;flex-direction:column;gap:10px}
.g-who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flag.big{width:33px;height:22px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.gcard{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;background:var(--board-2);border:2px solid transparent;border-radius:6px;padding:6px;color:#fff;cursor:pointer;font-family:var(--f-body)}
.gcard svg{display:block;border-radius:4px}
.gcard.on{border-color:var(--amber);background:var(--board-3)}
.gcard:hover{filter:brightness(1.1)}
.gname{font-family:var(--f-num);font-weight:700;font-size:16px;letter-spacing:.04em;margin-top:2px}
.gorg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.flag.sm{width:15px;height:10px}
.gstats{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.gs{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:#C9D2E3}
.gs i{font-style:normal}
.gs em{display:flex;gap:2px}
.gs b,.gs s{display:block;width:9px;height:5px;border-radius:1px;background:var(--amber)}
.gs s{background:var(--board)}
.gsum{background:var(--board-2);border-left:4px solid var(--amber);padding:8px 10px;border-radius:4px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.gsum span{color:#C9D2E3}
.wxbox{display:flex;gap:12px;align-items:center;background:var(--board-2);border-radius:4px;padding:8px 12px}
.wxbox .rows{flex:1}
.wx-icon{font-size:40px;line-height:1;color:var(--amber);flex:none}
.waxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.waxbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--board-2);border:2px solid transparent;border-radius:5px;padding:6px 8px;color:#fff;cursor:pointer;font-family:var(--f-body);text-align:left}
.waxbtn.on{border-color:var(--amber);background:var(--board-3)}
.waxbtn b{font-size:14px}
.waxbtn small{font-size:11px;color:#C9D2E3}
.wsw{display:block;width:100%;height:6px;border-radius:2px;margin-bottom:3px}
.ev-wx{font-family:var(--f-body);font-weight:700;font-size:12px;margin-top:3px;color:var(--ink)}
.ev-gear{font-family:var(--f-body);font-weight:700;font-size:11px;margin-top:2px;color:var(--ink);opacity:.9;max-width:min(560px,70vw)}
.ev-gear b{font-family:var(--f-num);letter-spacing:.03em}.ev-gear .up{color:#1E8E4A}.ev-gear .dn{color:#C62828}
.fperf{margin:10px 0;display:flex;flex-direction:column;gap:10px}
.fgear{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fgi{display:flex;gap:8px;align-items:center;background:var(--board-2);border-radius:4px;padding:5px 7px;border:1px solid transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fgi:hover,.fgi.open{border-color:var(--amber)}
.fgi em{font-style:normal;color:var(--amber);font-size:10px}
.fpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:8px;background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.35);border-radius:6px;animation:fpin .25s ease-out}
@keyframes fpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fpo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--board-2);border:1px solid transparent;border-radius:4px;padding:5px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.fpo svg{width:100%;border-radius:3px}.fpo b{font-family:var(--f-num);font-size:13px}.fpo small{font-size:10px;color:var(--muted)}
.fpo.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.fgi svg{width:58px;flex:none;border-radius:3px}
.fgi span{display:flex;flex-direction:column;font-size:12px;line-height:1.25;min-width:0}
.fgi small{color:var(--muted);font-size:10px}.fgi b{font-family:var(--f-num);font-size:14px;letter-spacing:.03em}
.fcond{font-size:12px;color:var(--muted)}.fcond b{color:inherit;font-weight:700}
.prow{display:grid;grid-template-columns:minmax(110px,auto) 1fr 64px 44px;gap:8px;align-items:center;font-size:12px;border-radius:4px;transition:background .6s}
.prow.changed{background:rgba(255,201,60,.08)}
.pdel{font-family:var(--f-num);font-weight:700;font-size:12px;text-align:left}.pdel.up{color:#2FB36A}.pdel.dn{color:#E5484D}

const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbw2YVS3hMxoQkzWI0EqKGVJbpXCJY2G_4hwhTWYIShozKaI7fmA9p1UaB1jl5d-GKKSIg/exec';

const CLOUD_SKIP = ['slalomwc-account', 'slalomwc-gate'];
async function cloudCall(body){

}
function cloudQueue(key, v){

}
async function cloudFlush(){
  const items = CLOUD.queue; CLOUD.queue = {};

  try { const r = await cloudCall({ action: 'save', token: CLOUD.token, items }); CLOUD.status = r.ok ? 'saved' : 'error'; if (r.error === 'auth') cloudLogout(true); }
  catch(e){ CLOUD.status = 'offline'; Object.assign(CLOUD.queue, items); clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudFlush, 20000); }
}
function localSaves(){

function cloudSetAccount(name, token){

}
function cloudLogout(silent){

const CLOUD_ERR = { name: '名前は2文字以上にしてください。', pin: '暗証番号は4〜8桁の数字です（ログインのときは、登録した番号と違います）。', taken: 'その名前はもう使われています。別の名前にするか、ログインしてください。', nouser: 'その名前は登録されていません。', locked: '番号を何度も間違えたため、このアカウントはロックされています。', auth: 'もう一度ログインしてください。' };
async function cloudAuth(kind, name, pin){
  const r = await cloudCall({ action: kind, name, pin });
  if (!r.ok) throw new Error(CLOUD_ERR[r.error] || '通信に失敗しました。時間をおいて試してください。');
  if (kind === 'register'){
    cloudSetAccount(r.name, r.token);
    // carry this device's progress into the new account
    await cloudCall({ action: 'save', token: r.token, items: localSaves() });
    return 'registered';
  }
  // login: replace this device's records with the account's records, then restart
  const d = await cloudCall({ action: 'load', token: r.token });
  cloudSetAccount(r.name, r.token);
  if (d.ok){ for (const [k, v] of Object.entries(d.data || {})) { try { localStorage.setItem(k, v); } catch(e){} } }
  try { const pf = JSON.parse(localStorage.getItem('slalomwc-prefs') || '{}'); pf.pname = r.name; pf.setupDone = true; localStorage.setItem('slalomwc-prefs', JSON.stringify(pf)); } catch(e){}
  return 'loggedin';
}

    <p class="lock-err" id="acErr" hidden></p>

function bindAccount(root){
  const out = root.querySelector('#acOut'); if (out) out.onclick = () => cloudLogout(false);
  const reg = root.querySelector('#acReg'), inb = root.querySelector('#acIn');
  if (!reg) return;
  const run = async kind => {
    const name = root.querySelector('#acName').value.trim(), pin = root.querySelector('#acPin').value.trim(), err = root.querySelector('#acErr');
    err.hidden = true; reg.disabled = inb.disabled = true;
    try {
      const res = await cloudAuth(kind, name, pin);
      if (res === 'loggedin') location.reload();
      else { pname = CLOUD.name; savePrefs(); $('#pname').value = pname; if (!$('#menu').hidden) renderTab(); else { const box = root.querySelector('.acct'); if (box){ box.outerHTML = accountHTML(); bindAccount(root); } } initTA(); }
    } catch(e){ err.textContent = e.message; err.hidden = false; }
    reg.disabled = inb.disabled = false;
  };
  reg.onclick = () => run('register');
  inb.onclick = () => run('login');
}

const FIELDS = { men: buildField('men'), women: buildField('women') };
// how much slower than the reference run the winner of the simulated field is (bigger = easier rivals)
const LEVEL_K = { wc: 1.00, ec: 1.04, jpn: 1.075, incol: 1.11, kansai: 1.15, ih: 1.19 };
const LEVEL_NAME = { wc:'ワールドカップ級', ec:'ヨーロッパカップ級', jpn:'全日本選手権級', incol:'全国インカレ級', kansai:'関西インカレ級', ih:'インターハイ級' };

// =====================================================================
// Course (10 units = 1 m)
// =====================================================================
const STEP = 1/120;
const W = 440;              // piste width between safety nets (44 m)
const GH = 25;              // half gate width -> 5.0 m between the two poles (FIS 4–6 m)
const POLE_R = 3, SK_R = 6;
const G = 125, DRAG = 0.0022, FR = 14;

function buildCourse(seedN, gender){
  const r = rng(seedN);
  const vd = gender === 'men' ? 180 + Math.round(r()*40) : 150 + Math.round(r()*45);   // vertical drop (m)
  const N = Math.round(vd * (0.30 + r()*0.04));                                       // ≈ 30–34 % of vertical drop
  const combos = [];
  const nHair = 2 + (r() < .5 ? 1 : 0), nVert = 1 + Math.floor(r()*3);
  for (let i = 0; i < nHair; i++) combos.push({ n: 2, tag: 'ヘアピン' });
  for (let i = 0; i < nVert; i++) combos.push({ n: 3 + (r() < .5 ? 1 : 0), tag: 'バーティカル' });
  const comboGates = combos.reduce((s, c) => s + c.n, 0);
  const seq = Array(Math.max(8, N - comboGates)).fill(null);
  shuffle(combos, r);
  combos.forEach((c, k) => { const pos = Math.floor((k + .5 + (r() - .5)*.6) / combos.length * (seq.length - 8)) + 4; seq.splice(pos + k, 0, c); });
  const gates = [];
  let y = 150, side = r() < .5 ? -1 : 1, prevT = 0, first = true;
  for (const it of seq){
    if (!it){
      const x = side * (12 + r()*30);
      const dist = 104 + r()*24;                     // gate-to-gate 10.4–12.8 m, so turning poles stay within FIS 6–13 m
      if (!first){ const dx = Math.abs(x - prevT); y += Math.max(92, dx*1.15, Math.sqrt(Math.max(0, dist*dist - dx*dx))); }
      gates.push({ x, y, tag: '' }); prevT = x; side = -side; first = false;
    } else {
      const cx = side * (4 + r()*18);
      const dist = 100 + r()*25;
      if (!first){ const dx = Math.abs(cx - prevT); y += Math.sqrt(Math.max(86*86, dist*dist - dx*dx)); }
      for (let k = 0; k < it.n; k++){ if (k) y += 62 + r()*8; gates.push({ x: cx + (it.n > 2 ? (k % 2 ? 6 : -6) : 0), y, tag: k === 0 ? it.tag : '' }); }
      prevT = cx; side = -side; first = false;
    }
  }
  gates.forEach((g, i) => { g.col = i % 2 ? 'blue' : 'red'; g.bend = [0,0]; g.bv = [0,0]; g.cool = [0,0]; g.res = 0; g.i = i; });
  const n = gates.length;
  return { gates, finishY: gates[n-1].y + 130, checks: [Math.floor(n*.25), Math.floor(n*.5), Math.floor(n*.75)], vd, nGates: n };
}
function resetCourseState(c){ c.gates.forEach(g => { g.bend = [0,0]; g.bv = [0,0]; g.cool = [0,0]; g.res = 0; }); }
function courseSeed(g, date){ return hashStr(`${g}-${date}`); }

// =====================================================================
// Physics (shared by the player, the demo skier and the reference simulation)
// =====================================================================
function newBody(){ return { x:0, y:-14, th:0, v:0, lean:0, tuck:false, px:0, py:-14, ng:0, block:null, pushT:0, pushCd:0 }; }
const PUSH_DUR = .48;
const SKATE_DUR = 1.05, SKATE_STEP = .35;      // two or three skating steps after the push-off

const START_WINDOW = 3;        // the start may be taken from the end of the long tone (first buzzer +5 s) until first buzzer +8 s
const START_CALL = 10;         // "10 seconds" is called, the buzzers begin 5 s later
let gateT = 0;
const NOMOD = { turn: 1, drag: 1, carve: 1, carveGain: 0, push: 0, tuck: 1, pole: 1, net: 1, night: 1, haze: 1, glare: 1, fr: 1 };
function physStep(b, ctl, dt, braking){
  b.lean += (ctl.inp - b.lean) * Math.min(1, dt*10);
  b.tuck = ctl.tuck;
  const m = b.mod || NOMOD;
  b.th = clamp(b.th + ctl.inp * (ctl.tuck ? 1.8 : 3.4) * m.turn * dt, -1.45, 1.45);
  if (braking){ b.v = Math.max(0, b.v - 150*dt); b.th *= (1 - dt*2); }
  else {
    let a = G*Math.cos(b.th) - DRAG*m.drag*(ctl.tuck ? .55*m.tuck : 1)*b.v*b.v - FR*(m.fr || 1);
    if (ctl.inp) a += (m.carveGain || 0) * b.v - .3*m.carve*b.v;
    b.v = Math.max(0, b.v + a*dt);
  }
  b.px = b.x; b.py = b.y;
  b.x += Math.sin(b.th)*b.v*dt;
  b.y += Math.cos(b.th)*b.v*dt;
  const lim = W/2 - SK_R;
  if (Math.abs(b.x) > lim){ const s = Math.sign(b.x); b.x = s*lim; b.th = -b.th*.3; b.v *= 1 - .45*m.net; return s; }
  return 0;
}
function crossGates(b, course, cb){
  const gs = course.gates;
  while (b.ng < gs.length && gs[b.ng].y <= b.y && b.py < gs[b.ng].y + 1e-9){
    const g = gs[b.ng];
    const f = b.y === b.py ? 1 : (g.y - b.py) / (b.y - b.py);
    const xc = b.px + (b.x - b.px) * f;
    cb(g, Math.abs(xc - g.x) < GH);
    b.ng++;
  }
}
function aiCtl(b, course){
  let g = course.gates[b.ng];
  if (g && g.y - b.y < 8 + b.v*.22 && Math.abs(b.x - g.x) < GH - 6) g = course.gates[b.ng + 1];
  const tx = g ? g.x : 0, ty = g ? g.y : course.finishY;
  const want = Math.atan2(tx - b.x, Math.max(30, ty - b.y));
  const d = want - b.th;
  return { inp: Math.abs(d) < .05 ? 0 : Math.sign(d), tuck: !g };
}
// Reference run: a clean robot run that sets the pace of the simulated field
function refRun(course){
  const b = newBody(); b.v = 45;
  let t = 0, timing = false; const at = [];
  for (let i = 0; i < 120*240; i++){
    physStep(b, aiCtl(b, course), STEP, false);
    if (!timing && b.py < 0 && b.y >= 0){ timing = true; t = 0; } else if (timing) t += STEP;
    crossGates(b, course, () => at.push(t));
    if (b.y >= course.finishY) break;
  }
  return { time: t, frac: at.map(s => s / t) };
}

// FIS tie-break for the standings: more wins, then more 2nd places, and so on

function seasonSL(){ return slRaces(gender).filter(r => r.disc === 'SL'); }

function slRaces(g){ return CAL[g].map((e, i) => ({ idx: i, date: e[0], venue: e[1], nat: e[2], disc: e[3], night: (e[4]||'').includes('n'), finals: (e[4]||'').includes('f'), tbc: (e[4]||'').includes('t') })); }

  const list = FIELDS[gender].map(a => ({ id: a.id, name: a.name, nat: a.nat, pts: s.pts[a.id] || 0, fis: a.fis, places: s.places[a.id] || [] }));

// Shared time-attack leaderboard (artifact db; per-viewer best on this device as a fallback)
// =====================================================================
const TA = { db: null, uid: null, docs: {}, status: 'connecting', canWrite: true };
function taKey(g, date){ return `${g}_${date}`; }
function taLocal(){ return load('slalomwc-ta') || {}; }
function validEntry(e){ return !!e && typeof e === 'object' && isFinite(e.t) && e.t > 15 && e.t < 400 && isFinite(e.r1) && isFinite(e.r2); }
function taBoard(key){
  const rows = [];
  for (const [uid, d] of Object.entries(TA.docs)){
    const e = d && d.best && d.best[key];
    if (!validEntry(e)) continue;
    rows.push({ uid, handle: String(d.handle || '名無し').slice(0, 14), t: +e.t, r1: +e.r1, r2: +e.r2, at: e.at, me: uid === TA.uid });
  }
  if (!TA.db && !(TA.cloud && CLOUD.token)){ const l = taLocal()[key]; if (validEntry(l)) rows.push({ uid: 'local', handle: pname, t: l.t, r1: l.r1, r2: l.r2, me: true }); }
  rows.sort((a, b) => a.t - b.t);
  rows.forEach(r => { r.rank = 1 + rows.filter(x => x.t < r.t).length; });
  return rows;
}
async function initTA(){
  const timer = setTimeout(() => { if (TA.status === 'connecting'){ TA.status = 'slow'; if (tab === 'ta' && !$('#menu').hidden) renderTab(); } }, 10000);
  try {
    if (!window.claude || !window.claude.use){
      if (CLOUD.url){ TA.cloud = true; TA.uid = CLOUD.name ? 'n:' + CLOUD.name : null; await cloudBoard(); clearTimeout(timer); return; }
      TA.status = 'off'; clearTimeout(timer); return;
    }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db){ TA.status = 'off'; clearTimeout(timer); if (tab === 'ta' && !$('#menu').hidden) renderTab(); return; }
    TA.db = db;
    TA.uid = user ? await user.id() : null;
    db.collection('ta').onSnapshot(snap => {
      const docs = {};
      for (const d of snap.docs) if (d.exists) docs[d.id] = d.data();
      TA.docs = docs;
      if (!snap.metadata.fromCache){ TA.status = 'ok'; clearTimeout(timer); }
      if (tab === 'ta' && !$('#menu').hidden) renderTab();
    }, err => { TA.status = 'error'; clearTimeout(timer); if (tab === 'ta' && !$('#menu').hidden) renderTab(); });
  } catch(e){ TA.status = 'off'; clearTimeout(timer); }
}
async function cloudBoard(){
  try {
    const r = await (await fetch(CLOUD.url + '?action=board')).json();
    const docs = {};
    for (const row of (r.rows || [])){ const id = 'n:' + row.name; (docs[id] = docs[id] || { handle: row.name, best: {} }).best[row.course] = { t: row.t, r1: row.r1, r2: row.r2 }; }
    TA.docs = docs; TA.status = 'ok';
  } catch(e){ TA.status = 'error'; }
  if (tab === 'ta' && !$('#menu').hidden) renderTab();
}
async function taSubmit(key, entry){
  // keep the personal best on this device in any case
  const loc = taLocal(); if (!validEntry(loc[key]) || entry.t < loc[key].t){ loc[key] = entry; save('slalomwc-ta', loc); }
  if (TA.cloud){
    if (!CLOUD.token) return { shared: false, needLogin: true };
    try { const r = await cloudCall({ action: 'ta', token: CLOUD.token, course: key, t: entry.t, r1: entry.r1, r2: entry.r2 }); await cloudBoard(); return r.ok ? { shared: true, improved: !!r.improved } : { shared: false }; }
    catch(e){ return { shared: false }; }
  }
  if (!TA.db || !TA.uid) return { shared: false };
  const mine = TA.docs[TA.uid] || {};
  const prev = mine.best && mine.best[key];
  if (validEntry(prev) && prev.t <= entry.t && mine.handle === pname) return { shared: true, improved: false };
  const best = Object.assign({}, mine.best || {});
  if (!validEntry(prev) || entry.t < prev.t) best[key] = entry;
  try { await TA.db.collection('ta').doc(TA.uid).set({ handle: pname.slice(0, 14), best }); return { shared: true, improved: !validEntry(prev) || entry.t < prev.t }; }
  catch(e){ if (e && e.code === 'invalid_argument') TA.canWrite = false; return { shared: false, error: e && e.code }; }
}

const COLD_VENUES = ['Levi', 'Åre', 'Kvitfjell', 'Jasná', 'Narvik', 'Gurgl', 'Sölden'];
const MILD_VENUES = ['Sun Valley', 'Killington', 'Soldeu', 'Courchevel', 'Tremblant', 'Kranjska Gora'];

function weatherFor(ev, g){
  const r = rng(hashStr('wx|' + g + '|' + ev.date + '|' + ev.venue));
  const mon = +ev.date.slice(5, 7);
  const base = ({ 10: -2, 11: -5, 12: -7, 1: -9, 2: -6, 3: -3 })[mon] ?? -6;
  const air0 = base + (COLD_VENUES.includes(ev.venue) ? -3 : 0) + (MILD_VENUES.includes(ev.venue) ? 2 : 0) + (ev.night ? -3 : 0) + (r() - .5) * 8;
  const pick = () => { const x = r(); return x < .48 ? 'sun' : x < .78 ? 'cloud' : 'snow'; };
  let cond = pick();
  const out = [];
  for (let run = 1; run <= 2; run++){
    if (run === 2 && r() < .35) cond = pick();                              // the sky can change between runs
    const air = air0 + (run === 2 ? (ev.night ? -1.2 : 1.6) : 0) + (r() - .5) * 1.6;
    let snowT = cond === 'snow' ? air - .6 - r() * .8 : air - 1.6 - r() * 2.4;
    snowT = Math.min(snowT, -.2);
    const surface = snowT > -1.5 ? '湿った雪' : cond === 'snow' ? '新雪まじり' : snowT < -11 ? 'アイス（とても硬い）' : '硬く締まったバーン';
    out.push({ cond, air: Math.round(air * 10) / 10, snowT: Math.round(snowT * 10) / 10, surface });
  }
  return out;
}
// All waxes are fluoro-free (FIS banned fluorinated wax from the 2023/24 season).
const WAXES = [

  { id: 'green',  name: 'グリーン',     sub: '低温用',     lo: -14, hi: -7,  col: '#2F9E44' },

function waxMatch(w, wx){

  let m = 1 - d * .22;

}
function waxGrade(m){ return m > .9 ? '◎ ぴったり' : m > .7 ? '○ 良い' : m > .4 ? '△ いまひとつ' : '× 合っていない'; }
// gear + wax for the player's run
function runMods(){

    if (race.shimizu && race.shimizu[race.run - 1]){ m.carve = 0; m.shimizu = true; }   // no speed lost in the turns

function modsFor(wx, waxId, ed){
  const m = gearMods(myGear);

    const mt = waxMatch(waxById(waxId), wx);
    m.drag *= 1 + (1 - mt) * .05;
    m.fr = 1 + (1 - mt) * .35;
    if (wx.cond === 'snow') m.haze *= 1.7; else if (wx.cond === 'cloud') m.haze *= 1.25;

function makeRace(ev, mode){
  const g = gender;

  const courses = [buildCourse(sd ^ 0x1111, g), buildCourse(sd ^ 0x2222, g)];   // two runs, two different sets
  const refs = courses.map(refRun);
  const base = { ev, mode, courses, refs, run: 1, playerDsq: [false, false], finals: ev.finals, maxV: 0, wx: weatherFor(ev, g), wax: [lastWax, lastWax], edge: [Object.assign({}, lastEdge), Object.assign({}, lastEdge)] };

  const st = ranking();
  let entrants;
  if (mode === 'dns'){                // the race goes ahead without you
    entrants = st.filter(e => !e.me);
    if (ev.finals) entrants = entrants.slice(0, 25);
  } else if (ev.finals){
    entrants = st.slice(0, 25);       // Finals: top 25 of the discipline standings
    if (!entrants.find(e => e.me)){ if (mode === 'career') return { blocked: true }; entrants = st.slice(0, 24).concat(st.find(e => e.me)); }
  } else entrants = st.slice();

  const meE = entrants.find(e => e.me), rivals = entrants.filter(e => !e.me);

  if (meE){
    // your bib: the opener is drawn from 40–80; after that it follows your World Cup ranking, a little ahead of it each time
    const st = ranking(), myR = st.findIndex(e => e.me) + 1, played = Object.keys(season().done).length;
    let lo, hi;
    if (!played || !(st.find(e => e.me).pts)){ lo = played ? Math.max(30, 40 - played * 2) : 40; hi = played ? Math.max(lo + 10, 80 - played * 4) : 80; }
    else if (myR <= 7){ lo = 1; hi = 7; }
    else if (myR <= 15){ lo = 8; hi = 15; }
    else { lo = Math.max(16, Math.round(myR * .7)); hi = Math.max(lo + 6, Math.round(myR * 1.05)); }

  const sim = (id, run) => {
    const a = byId.get(id);

    if (r() < pDnf) return null;
    const t0 = refs[run-1].time * k * (1 + .065*Math.pow(1 - a.skill, 1.1) + gauss(r)*.0075 - a.aggr*.002 + (form[id] || 0));

  const out = [];

  }
  out.sort((x, y) => x.t - y.t);
  out.forEach(o => { o.rank = 1 + out.filter(x => x.t < o.t).length; });

  for (const k of padState.values()){ if (k === 'left') l = true; else if (k === 'right') r = true; else if (k === 'down') d = true; }
  // left and right together: plant both poles and push (skating-style double pole)
  if (l && r) return { inp: 0, tuck: false, push: true };
  const dir = (r ? 1 : 0) - (l ? 1 : 0);
  // outer-ski steering (default): weighting the right ski turns you left, like real skiing
  return { inp: ctrl === 'outer' ? -dir : dir, tuck: d };
}

// =====================================================================
// Simulation step
// =====================================================================
function step(dt){
  for (const g of course.gates){
    for (let k = 0; k < 2; k++){
      if (g.bend[k] || g.bv[k]){
        g.bv[k] += (-90*g.bend[k] - 7*g.bv[k]) * dt; g.bend[k] += g.bv[k]*dt;
        if (Math.abs(g.bend[k]) < .002 && Math.abs(g.bv[k]) < .01){ g.bend[k] = 0; g.bv[k] = 0; }
      }
      if (g.cool[k] > 0) g.cool[k] -= dt;
    }
  }
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i,1); continue; } p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .94; p.vy *= .94; }

  if (state === 'inspect'){
    // sideslip down the line of the gates, staying a little beside the turning poles
    const gs = course.gates;
    // you move along the course yourself: swipe / drag, wheel or arrow keys. Optional auto-advance.
    let move = insp.vel * dt;
    if (insp.drag === null) insp.vel *= Math.pow(.01, dt);                     // a flick keeps gliding, then settles
    if (Math.abs(insp.vel) < 4) insp.vel = 0;
    if (insp.keyF) move += 150 * dt;
    if (insp.keyB) move -= 150 * dt;
    if (insp.auto) move += 60 * dt;
    sk.y = clamp(sk.y + move + insp.push, -14, course.finishY + 30); insp.push = 0;
    sk.ng = 0; while (sk.ng < gs.length && gs[sk.ng].y <= sk.y) sk.ng++;
    const g = gs[sk.ng];
    const tx = g ? g.x + (g.x > 0 ? -GH - 14 : GH + 14) * .4 : 0;
    sk.x += (tx - sk.x) * Math.min(1, dt * 2.5);
    sk.th = 1.45 * inspSide; sk.v = 0; sk.lean = 0; sk.tuck = false;
    const lp = trail[trail.length - 1];
    if (!lp || Math.hypot(sk.x - lp.x, sk.y - lp.y) > 5) trail.push({ x: sk.x, y: sk.y, th: 0 });
    $('#inspInfo').textContent = sk.y < 0 ? 'スタート地点' : sk.ng >= gs.length ? 'フィニッシュ' : `第${sk.ng + 1}旗門の手前 / 全${gs.length}旗門`;
    if (insp.auto && sk.y >= course.finishY + 30){ insp.auto = false; $('#inspSpd').textContent = '自動で進む'; }
    return;
  }
  if (state === 'countdown'){
    // start procedure: "10 seconds" is called; at 5 s the buzzer sounds once a second, five times —
    // the 4th is high, the 5th high and long. The racer must leave between the end of the long tone and 3 s after it
    const before = cdT;
    cdT -= dt;
    if (before > START_CALL - .05 && !race.called10){ race.called10 = true; tone(520, .18, 'triangle', .07); setTimeout(() => tone(620, .22, 'triangle', .07), 200); }
    for (const b of [5, 4, 3, 2, 1]){
      if (before > b && cdT <= b){
        if (b >= 3) tone(780, .12, 'square', .08);              // 1st–3rd: low
        else if (b === 2) tone(1320, .12, 'square', .09);       // 4th: high
        else tone(1320, .98, 'square', .09);                    // 5th: high and long
      }
    }
    // leaving during the buzzers is a false start
    if (cdT <= 5 && race.mode !== 'free' && playerInput().push){
      dsq = true; state = 'finished'; finT = 2;
      race.playerDsq[race.run - 1] = 'DSQ';
      race.dsqWhy = race.dsqWhy || []; race.dsqWhy[race.run - 1] = 'フライング（長音が終わる前にスタートした）による失格';
      $('#cd').className = 'cd dsq'; $('#cd').textContent = 'DSQ';
      $('#cTime').textContent = 'DSQ'; $('#cTime').hidden = false;
      flash('フライング — 失格', true); tone(180, .35, 'sawtooth', .08);
      recordPlayerTime(null);
      return;
    }
    if (cdT <= 0){ state = 'gate'; gateT = START_WINDOW; }
    return;
  }
  if (state === 'gate'){
    // FIS: after the start signal the racer has 10 seconds to leave the start. Push off with both poles (left + right).
    const before = Math.ceil(gateT);
    gateT -= dt;
    const c = playerInput();
    if (c.push){
      state = 'run'; goT = .5;
      const m = sk.mod || NOMOD;
      sk.v = 45 + m.push + 6;                          // the start push out of the gate
      sk.pushT = PUSH_DUR; sk.pushCd = PUSH_DUR + .06; sk.skateT = SKATE_DUR + PUSH_DUR * .6;
      tone(240, .06, 'triangle', .05);
    } else if (gateT <= 0 && race.mode === 'free'){
      gateT = 0;
    } else if (gateT <= 0){
      dsq = true; state = 'finished'; finT = 2;
      race.playerDsq[race.run - 1] = 'DSQ';
      race.dsqWhy = race.dsqWhy || []; race.dsqWhy[race.run - 1] = 'スタート遅れ（最初のブザーから8秒以内にスタートしなかった）による失格';
      $('#cd').className = 'cd dsq'; $('#cd').textContent = 'DSQ';
      $('#cTime').textContent = 'DSQ'; $('#cTime').hidden = false;
      flash('スタート遅れ — 失格', true); tone(180, .35, 'sawtooth', .08);
      recordPlayerTime(null);
    }
    return;
  }
  if (goT > 0) goT -= dt;
  stepWand(dt);
  if (sk.skateT > 0 && state === 'run'){
    const before = sk.skateT; sk.skateT -= dt;
    const k0 = Math.floor((SKATE_DUR - before) / SKATE_STEP), k1 = Math.floor((SKATE_DUR - sk.skateT) / SKATE_STEP);
    if (before <= SKATE_DUR && k1 > k0 && k1 <= 3){ sk.v += 7 * clamp(1 - sk.v / 160, 0, 1); tone(300, .04, 'triangle', .03); }   // each skating step
  }
  if ((state === 'run' || state === 'demo') && sk.y > 0 && sk.y < RAMP_END) sk.v += 55 * (1 - sk.y / RAMP_END) * dt;
  if (state !== 'run' && state !== 'finished' && state !== 'demo') return;

  const ctl = state === 'run' ? playerInput() : state === 'demo' ? aiCtl(sk, course) : { inp: 0, tuck: false };
  const quiet = state === 'demo';
  if (sk.act){ sk.act.t += dt; if (sk.act.type === 'stop') sk.th = sk.act.dir * 1.4; if (sk.act.type === 'skisup') sk.v = 0; if (sk.act.t > (sk.act.type === 'skisup' ? 99 : 1.8)) sk.act = null; }
  if (sk.pushT > 0) sk.pushT -= dt;
  if (sk.pushCd > 0) sk.pushCd -= dt;
  if (state === 'run' && ctl.push && !(sk.pushCd > 0)){
    // double-pole push: strong near the start, fading out by ~43 km/h. The pole you chose sets the strength
    const m = sk.mod || NOMOD;
    sk.v += (22 + m.push * 1.6) * clamp(1 - sk.v / 140, 0, 1);
    sk.pushT = PUSH_DUR; sk.pushCd = PUSH_DUR + .06;
    if (!quiet) tone(240, .05, 'triangle', .04);
  }
  const net = physStep(sk, ctl, dt, state === 'finished');
  if (state === 'run') maxV = Math.max(maxV, sk.v);
  if (net){ burst(sk.x, sk.y, -net, 14); if (!quiet){ thwack(.35); flash('セーフティネットに接触', true); } }

  if (!timing && sk.py < 0 && sk.y >= 0){
    timing = true;
    const vy = (sk.y - sk.py) / dt;
    t = vy > 0 ? sk.y / vy : 0;
    if (!quiet) tone(660, .08, 'sine', .08);
  } else if (timing && state !== 'finished') t += dt;

  // pole contact (allowed in slalom — the pole folds away).
  // On a tight line the racer clears the pole with the hand: a cross-block, which costs almost no speed.
  if (sk.block){ sk.block.t += dt; if (sk.block.t > sk.block.dur) sk.block = null; }
  for (let i = Math.max(0, sk.ng - 2); i < Math.min(course.gates.length, sk.ng + 3); i++){
    const g = course.gates[i];
    const gy = g.y - sk.y;
    if (gy < -12 || gy > 34) continue;
    for (let k = 0; k < 2; k++){
      const px = g.x + (k ? GH : -GH), ddx = px - sk.x;
      // reach for a pole coming up close beside the line
      if (!sk.block && g.cool[k] <= 0 && gy > 3 && gy < 30 && Math.abs(ddx) > 2.5 && Math.abs(ddx) < 15 && sk.v > 40)
      {
        // deep arc with the pole on the inside: cross-block with the far hand.
        // shallow arc (or pole on the other side): brush it away with the hand on the turn side
        // pole on the inside of the turn: always cross-block on a deep arc, and fairly often even on a shallow one
        const turnSide = Math.abs(sk.lean) > .15 ? Math.sign(sk.lean) : Math.sign(sk.th);
        const inside = Math.sign(ddx) === turnSide;
        const deep = Math.abs(sk.th) >= .3 || Math.abs(sk.lean) >= .55;
        const pCross = inside ? (deep ? 1 : clamp(.45 + Math.abs(sk.th) * 1.2 + Math.abs(sk.lean) * .4, 0, .85)) : .15;
        const mode = Math.random() < pCross ? 'cross' : 'near';
        sk.block = { t: 0, dur: clamp(gy / Math.max(60, sk.v) + .18, .26, .5), side: Math.sign(ddx), gi: i, k, mode };
      }
      const mine = sk.block && sk.block.gi === i && sk.block.k === k;
      const reach = mine ? 14 : POLE_R + SK_R;
      if (Math.abs(gy) < 6 && Math.hypot(ddx, gy) < reach && g.cool[k] <= 0){
        g.cool[k] = .5;
        const blocked = mine && Math.abs(ddx) > 2.5;
        g.bv[k] += (Math.sign(ddx) || 1) * (blocked ? 10 + sk.v*.05 : 6 + sk.v*.04);
        if (state !== 'finished') sk.v *= sk.mod && sk.mod.shimizu ? 1.03 : 1 - (blocked ? .012 : .05) * (sk.mod ? sk.mod.pole : 1);   // Shimizu spec: knocking a pole gives +3%
        if (!quiet) thwack(blocked ? .32 : .22);
      }
    }
  }

  crossGates(sk, course, (g, ok) => {
    if (ok){ g.res = 1; if (!quiet && state === 'run') tone(g.col === 'red' ? 520 : 620, .06, 'triangle', .05); }
    else { g.res = -1; if (state === 'run') onMiss(g); }
    if (state === 'run') onGateSplit(g.i);
  });

  if (state === 'run' && sk.py < course.finishY && sk.y >= course.finishY){
    const vy = (sk.y - sk.py) / dt;
    t -= vy > 0 ? (sk.y - course.finishY) / vy : 0;
    finishRun();
  }
  if (state === 'demo' && (sk.y > course.finishY + 200 || (sk.v < 2 && sk.y > 0))) startDemo();

  const lp = trail[trail.length - 1];
  if (!lp || Math.hypot(sk.x - lp.x, sk.y - lp.y) > 5) trail.push({ x: sk.x, y: sk.y, th: sk.th, inp: ctl.inp || 0 });
  if (ctl.inp && sk.v > 50 && Math.random() < .8){
    const px = Math.cos(sk.th), py = -Math.sin(sk.th);
    for (let n = 0; n < 2; n++){
      const sp = 30 + Math.random()*70;
      parts.push({ x: sk.x - Math.sin(sk.th)*6, y: sk.y - Math.cos(sk.th)*6, vx: -ctl.inp*px*sp + Math.sin(sk.th)*sk.v*.3, vy: -ctl.inp*py*sp + Math.cos(sk.th)*sk.v*.3, life: .5 + Math.random()*.4, max: .9, r: 1 + Math.random()*1.8 });
    }
  }
}
function burst(x, y, dir, n){ for (let i = 0; i < n; i++) parts.push({ x, y, vx: dir*(40+Math.random()*90), vy: (Math.random()-.3)*90, life: .6, max: .6, r: 1.5 + Math.random()*2 }); }

function onMiss(g){
  if (race.mode === 'free'){ race.misses = (race.misses || 0) + 1; tone(220, .2, 'sawtooth', .05); flash(`第${g.i + 1}旗門を外しました（練習なので続行）`, true); return; }
  // FIS: every gate must be passed correctly, otherwise the racer is disqualified
  tone(180, .35, 'sawtooth', .08);
  dsq = true; state = 'finished'; finT = 1.8;
  race.playerDsq[race.run - 1] = 'DSQ';
  $('#cd').className = 'cd dsq'; $('#cd').textContent = 'DSQ';
  $('#cTime').textContent = 'DSQ'; $('#cTime').hidden = false;
  flash(`第${g.i + 1}旗門 不通過 — 失格`, true);
  recordPlayerTime(null);
}

function leaderBefore(){
  if (race.mode === 'free') return null;
  if (race.mode === 'ta'){
    const b = taBoard(race.key)[0];
    return b ? { name: b.handle, total: race.run === 1 ? b.r1 : b.t, run: race.run === 1 ? b.r1 : b.r2, r1: b.r1, label: 'コースレコード' } : null;
  }
  if (race.run === 1){
    const myBib = race.bib.get('you');
    let best = null;
    for (const e of race.entrants){ if (e.me || race.bib.get(e.id) > myBib) continue; const tt = race.run1[e.id]; if (tt != null && (!best || tt < best.total)) best = { id: e.id, name: nameOf(e.id), total: tt, run: tt }; }
    return best && Object.assign(best, { label: 'トップ' });
  }
  const idx = race.order2.indexOf('you');
  let best = null;
  for (let i = 0; i < idx; i++){ const id = race.order2[i]; const a = race.run1[id], b = race.run2[id]; if (a != null && b != null){ const tot = trunc(a + b); if (!best || tot < best.total) best = { id, name: nameOf(id), total: tot, run: b, r1: a }; } }
  return best && Object.assign(best, { label: 'トップ' });
}
// diff to the leader at every gate (negative = ahead); drives the progress bar colours and the flag beside it
let gateDiff = [], lastDiff = null;
function onGateSplit(gi){
  if (dsq) return;
  const ld = race.leader;
  if (!ld) return;
  const mine = race.run === 1 ? t : race.run1Me + t;
  const f = race.refs[race.run - 1].frac[gi] || ((gi + 1) / course.gates.length);
  const lt = (race.run === 1 ? 0 : ld.r1) + ld.run * f;
  gateDiff[gi] = mine - lt;
  lastDiff = { gi, d: mine - lt };
}

function waxRow(run){ if (!race.wx) return ''; const w = waxById(race.wax[run - 1]), wx = race.wx[run - 1]; return `<dt>${run}本目のワックス（雪温 ${wx.snowT.toFixed(1)}℃）</dt><dd style="font-family:var(--f-body);font-size:14px">${w.name} ${waxGrade(waxMatch(w, wx))}</dd>` + (race.edge ? `<dt>${run}本目のエッジ（${wx.surface}）</dt><dd style="font-family:var(--f-body);font-size:14px">${race.edge[run - 1].side}° / ${race.edge[run - 1].base.toFixed(1)}° ${waxGrade(edgeMatch(race.edge[run - 1], wx))}</dd>` : ''); }

function finishRun(){

  if (race.mode === 'ta'){
    const tot = race.run === 1 ? tt : trunc(race.taTimes[0] + tt);
    finishCard(tot, ld ? ld.total : null, ld ? (tot < ld.total ? 1 : 2) : 1);
    crowdCheer(ld && tot < ld.total ? .85 : .5);
    return;

  if (race.run === 1){

    const pr = rankOf(pool, 'you');

    const pool = {}; for (let i = 0; i <= idx; i++){ const id = race.order2[i]; const a = race.run1[id], b = id === 'you' ? tt : race.run2[id]; pool[id] = a != null && b != null ? trunc(a + b) : null; }

function freeCourse(seed){
  const r = rng(seed);
  const target = FREE.len === 'long' ? 10000 : 4000;            // 10 units = 1 m
  if (FREE.gates === 'none'){
    const vd = Math.round(target / 10 * .32);
    return { gates: [], finishY: target, checks: [], vd, nGates: 0 };
  }
  if (FREE.gates === 'rhythm'){
    // the same distance and the same offset every gate, left–right–left…

      gates.push({ x: (i % 2 ? -side0 : side0) * R.off, y, tag: '', col: i % 2 ? 'blue' : 'red', bend: [0,0], bv: [0,0], cool: [0,0], res: 0, i });
    }
    const n = gates.length;
    return { gates, finishY: gates[n - 1].y + 130, checks: [Math.floor(n * .25), Math.floor(n * .5), Math.floor(n * .75)], vd: Math.round(target / 10 * .32), nGates: n };
  }
  // practice set: chain slalom sets until the run is long enough
  const gates = [];
  let off = 0, vd = 0, k = 0;
  while (off < target - 1500){
    const c = buildCourse(seed ^ (0x3131 * (k + 1)), gender);
    for (const g of c.gates) gates.push(Object.assign(g, { y: g.y + off, tag: off && g === c.gates[0] ? '' : g.tag }));
    off += c.gates[c.gates.length - 1].y + 140; vd += c.vd; k++;
  }
  gates.forEach((g, i) => { g.i = i; g.col = i % 2 ? 'blue' : 'red'; });
  const n = gates.length;
  return { gates, finishY: gates[n - 1].y + 130, checks: [Math.floor(n * .25), Math.floor(n * .5), Math.floor(n * .75)], vd, nGates: n };
}
function freeWeather(ev){

// =====================================================================
// Rendering — chase camera a little above and behind the skier, looking down the slope (perspective).
// The skier sits low on screen; gates, poles and trees grow as they come toward the camera.
// =====================================================================
let cw = 0, ch = 0, dpr = 1, S = 1;
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = r.width; ch = r.height;
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  S = Math.min(cw / 330, ch / 380);        // scale at the skier's depth (pixels per 10 cm)
}
addEventListener('resize', resize);
const CAM = { z0: 500, f: 1, H: 1, yH: 0, camZ: 0, zTop: 900, zBot: 300 };
function setupCamera(baseFrac){
  const ys = ch * (1 - baseFrac);                   // where the skier's feet are on screen
  CAM.yH = -0.95 * ch;                              // horizon well above the screen: a gentle, slightly-from-behind tilt
  const ratio = (0 - CAM.yH) / (ys - CAM.yH);       // size at the top edge relative to the skier
  CAM.z0 = 440 / (1 / ratio - 1);                   // about 44 m of slope visible ahead of the skier
  CAM.f = S * CAM.z0;
  CAM.H = (ys - CAM.yH) / S;
  CAM.camZ = sk.y - CAM.z0;
  CAM.zTop = CAM.f / ((0 - CAM.yH) / CAM.H);
  CAM.zBot = CAM.f / ((ch - CAM.yH) / CAM.H);
}
function proj(x, y){
  const z = y - CAM.camZ;
  if (z < 15) return null;
  const k = CAM.f / z;
  return { X: cw/2 + (x - camX) * k, Y: CAM.yH + CAM.H * k, k };
}
const COL = { snow:'#F2F6FA', snow2:'#E8EEF6', off:'#E6EDF6', ink:'#13213A', red:'#D42A2F', blue:'#1F55C8', net:'#F07A1A', track:'rgba(110,135,180,.42)', shadow:'rgba(40,60,110,.18)' };

function quad(x0, x1, ya, yb){
  const a = proj(x0, ya), b = proj(x1, ya), c = proj(x1, yb), d = proj(x0, yb);
  if (!a || !b || !c || !d) return false;
  ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.lineTo(c.X, c.Y); ctx.lineTo(d.X, d.Y); ctx.closePath();
  return true;
}

// =====================================================================
// Night race: the slope is dark except where the floodlights fall. The goggle lens sets how dark it looks
// =====================================================================
const NIGHT_GAP = 260;                 // a floodlight mast every 26 m on each side
let nightCv = null, nctx = null;
function lightMasts(yNear, yFar){
  const out = [];
  for (let y = Math.floor((yNear - 300) / NIGHT_GAP) * NIGHT_GAP; y < yFar + 400; y += NIGHT_GAP){
    const L = (Math.floor(y / NIGHT_GAP) % 2) === 0;    // masts alternate side to side
    out.push({ x: (L ? -1 : 1) * (W / 2 + 26), y, side: L ? -1 : 1 });
  }
  return out;
}
function drawNight(md){
  if (!nightCv){ nightCv = document.createElement('canvas'); nctx = nightCv.getContext('2d'); }
  if (nightCv.width !== cv.width || nightCv.height !== cv.height){ nightCv.width = cv.width; nightCv.height = cv.height; }
  const n = nctx;
  n.setTransform(dpr, 0, 0, dpr, 0, 0);
  n.globalCompositeOperation = 'source-over';
  n.clearRect(0, 0, cw, ch);
  const dark = clamp(.9 * (.25 + .75 * md.night), .25, .93);
  // darker still toward the far end of the slope
  const dg = n.createLinearGradient(0, 0, 0, ch);
  dg.addColorStop(0, `rgba(4,8,22,${Math.min(.97, dark + .08)})`); dg.addColorStop(1, `rgba(6,12,30,${dark})`);
  n.fillStyle = dg; n.fillRect(0, 0, cw, ch);
  // floodlight pools cut out of the dark
  const yNear = CAM.camZ + CAM.zBot, yFar = CAM.camZ + CAM.zTop;
  const masts = lightMasts(yNear, yFar);
  n.globalCompositeOperation = 'destination-out';
  for (const m of masts){
    const c = proj(m.side * W * .12, m.y + 60);
    if (!c) continue;
    const rx = 300 * c.k, ry = rx * .55;
    n.save(); n.translate(c.X, c.Y); n.scale(1, ry / rx);
    const g = n.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, 'rgba(0,0,0,.92)'); g.addColorStop(.55, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g; n.beginPath(); n.arc(0, 0, rx, 0, 7); n.fill(); n.restore();
  }
  // the racer's own surroundings never go fully black (spill light and the snow's glow)
  const sp = proj(sk.x, sk.y);
  if (sp){ const g = n.createRadialGradient(sp.X, sp.Y - 20, 0, sp.X, sp.Y - 20, 140 * sp.k + 40); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); n.fillStyle = g; n.fillRect(0, 0, cw, ch); }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(nightCv, 0, 0); ctx.restore();
  // the masts and their lamps, with a warm glow
  for (const m of masts){
    const b = proj(m.x, m.y);
    if (!b) continue;
    const h = 95 * b.k, lx = b.X - m.side * 10 * b.k;
    ctx.strokeStyle = 'rgba(30,36,52,.95)'; ctx.lineWidth = Math.max(1, 2.2 * b.k);
    ctx.beginPath(); ctx.moveTo(b.X, b.Y); ctx.lineTo(b.X, b.Y - h); ctx.lineTo(lx, b.Y - h); ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const r = Math.max(6, 34 * b.k);
    const g = ctx.createRadialGradient(lx, b.Y - h, 0, lx, b.Y - h, r);
    g.addColorStop(0, 'rgba(255,246,220,.95)'); g.addColorStop(.25, 'rgba(255,226,160,.45)'); g.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, b.Y - h, r, 0, 7); ctx.fill();
    // a soft beam down onto the piste
    const t = proj(m.side * W * .12, m.y + 60);
    if (t){
      const bg = ctx.createLinearGradient(lx, b.Y - h, t.X, t.Y);
      bg.addColorStop(0, `rgba(255,236,190,${.06 / Math.max(.6, md.night)})`); bg.addColorStop(1, 'rgba(255,236,190,0)');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(lx - 3, b.Y - h); ctx.lineTo(lx + 3, b.Y - h); ctx.lineTo(t.X + 120 * t.k, t.Y + 20 * t.k); ctx.lineTo(t.X - 120 * t.k, t.Y - 20 * t.k); ctx.closePath(); ctx.fill();
    }

// ---- course wear: the racing line digs in with every racer before you, and more as the day warms up ----
let WEAR = 0;
function courseWear(){
  if (!race || state === 'demo') return .15;
  if (race.mode === 'free') return .08;
  if (race.battle) return .2;
  const wx = race.wx ? race.wx[race.run - 1] : null;
  let n;
  if (race.mode === 'ta') n = 18;
  else if (race.run === 1) n = (race.bib && race.bib.get('you') || 1) - 1;
  else n = Math.max(0, (race.order2 || []).indexOf('you'));
  let w = 1 - Math.exp(-n / 32);
  if (wx){
    w *= .55 + .9 * (1 - snowHardness(wx));                        // soft or wet snow ruts far more than ice
    if (race.run === 2 && wx.cond === 'sun' && !race.ev.night) w += .08;   // afternoon sun softens the second run
  }
  return clamp(w, 0, 1);
}
function wearLabel(w){ return w < .12 ? 'ほぼ荒れていない' : w < .35 ? '少し掘れている' : w < .6 ? 'かなり掘れている' : '深くえぐれている'; }
// earlier racers' lines: real runs of the robot skier on this very course, each with its own way of skiing it
function aiLine(course, j){
  const r = rng(hashStr('line|' + j) ^ course.nGates);
  const tight = (r() - .35) * 14;            // + aims nearer the turning pole, − skis a rounder line
  const early = .16 + r() * .14;             // how early the next turn starts
  const dead = .03 + r() * .06;
  const b = newBody(); b.v = 40 + r() * 10; b.x = (r() - .5) * 4;
  const pts = [];
  for (let i = 0; i < 120 * 240; i++){
    let g = course.gates[b.ng];
    if (g && g.y - b.y < 8 + b.v * early && Math.abs(b.x - g.x) < GH - 6) g = course.gates[b.ng + 1];
    let tx = 0, ty = course.finishY;
    if (g){ const sd = Math.sign(g.x) || 1; tx = g.x - sd * tight; ty = g.y; }
    const d = Math.atan2(tx - b.x, Math.max(30, ty - b.y)) - b.th;
    const inp = Math.abs(d) < dead ? 0 : Math.sign(d);
    physStep(b, { inp, tuck: !g }, STEP, false);
    crossGates(b, course, () => {});
    const lp = pts[pts.length - 1];
    if (!lp || Math.hypot(b.x - lp.x, b.y - lp.y) > 4) pts.push({ x: b.x, y: b.y, th: b.th, inp });
    else if (inp) lp.inp = lp.inp || inp;
    if (b.y >= course.finishY + 40) break;
  }
  // the robot taps its turns; read each turn from how its heading is actually changing instead,
  // so every turn is one held press, like a player holding the button
  const th = pts.map(q => q.th);
  for (let i = 0; i < pts.length; i++){
    const d = th[Math.min(th.length - 1, i + 2)] - th[Math.max(0, i - 2)];
    pts[i].inp = Math.abs(d) > .03 ? Math.sign(d) : 0;
  }
  return pts;
}
// a carved track shows only while the skier is turning: each press of a turn button is one arc,
// deepest at the middle of the press (the apex) and fading to nothing at both ends; straight gliding leaves almost no mark
function trackWeights(pts){
  const n = pts.length, wt = new Float32Array(n);
  let i = 0;
  while (i < n){
    const p = pts[i];
    if (p.inp === undefined){ wt[i] = 1; i++; continue; }            // side-slip marks from the inspection
    if (!p.inp){ wt[i] = .03; i++; continue; }
    const sg = Math.sign(p.inp); let e = i, gap = 0;
    for (let j = i + 1; j < n; j++){
      const q = pts[j]; if (q.inp === undefined) break;
      if (Math.sign(q.inp) === sg){ e = j; gap = 0; } else if (!q.inp && gap < 3) gap++; else break;

  dv.setUint32(n - 4, bitLen >>> 0); dv.setUint32(n - 8, Math.floor(bitLen / 4294967296));
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64);
  const rotr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let off = 0; off < n; off += 64){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i*4);
    for (let i = 16; i < 64; i++){
      const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++){
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = h.map((v, i) => (v + [a, b, c, d, e, f, g, hh][i]) >>> 0);
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}
function gateOpen(){ try { return localStorage.getItem('slalomwc-gate') === GATE_HASH; } catch(e){ return false; } }
function bootGame(){ if (setupDone) showMenu('cal'); else showSetup(); }
function showLock(){
  $('#menu').hidden = true; $('#sheet').hidden = true; $('#lock').hidden = false;
  setTimeout(() => { try { $('#lockPw').focus(); } catch(_){} }, 50);
  $('#lockForm').onsubmit = e => {
    e.preventDefault();
    const ok = sha256hex('slalom-gate|' + $('#lockPw').value) === GATE_HASH;
    if (!ok){ $('#lockErr').hidden = false; $('#lockPw').select(); return; }
    try { localStorage.setItem('slalomwc-gate', GATE_HASH); } catch(_){}
    $('#lock').hidden = true; $('#lockPw').value = '';
    bootGame();
  };
}
startDemo();
if (gateOpen()) bootGame(); else showLock();
initTA();
requestAnimationFrame(frame);
